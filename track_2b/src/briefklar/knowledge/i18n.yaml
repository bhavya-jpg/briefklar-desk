    tr: "Dikkat: bu mektupta uyarı işaretleri var."
  flagged_wait:
    en: "Do not pay and do not call before the counsellor has checked this letter."
    de: "Zahlen Sie nicht und rufen Sie nicht an, bevor die Beratungsperson den Brief geprüft hat."
    fr: "Ne payez pas et n'appelez pas avant que la conseillère ou le conseiller ait vérifié cette lettre."
    it: "Non paghi e non telefoni prima che la consulente o il consulente abbia verificato questa lettera."
    sq: "Mos paguani dhe mos telefononi para se këshilltari ta ketë kontrolluar këtë letër."
    pt: "Não pague nem telefone antes de o conselheiro verificar esta carta."
    bcs: "Ne plaćajte i ne zovite prije nego što savjetnik provjeri ovo pismo."
    es: "No pague ni llame antes de que el asesor revise esta carta."
    ta: "ஆலோசகர் இந்தக் கடிதத்தைச் சரிபார்க்கும் வரை பணம் செலுத்தவோ அழைக்கவோ வேண்டாம்."
    ti: "ኣማኻሪ ነዚ ደብዳበ ክሳብ ዘረጋግጾ ኣይትኽፈሉ፣ ኣይትደውሉ።"
    ar: "لا تدفع ولا تتصل قبل أن يراجع المستشار هذه الرسالة."
    uk: "Не платіть і не телефонуйте, доки консультант не перевірить цей лист."
    tr: "Danışman bu mektubu kontrol etmeden ödeme yapmayın ve aramayın."
  disclaimer:
    en: "Briefklar explains letters. It does not give legal advice. Check with the counsellor."
    de: "Briefklar erklärt Briefe. Es gibt keine Rechtsberatung. Fragen Sie die Beratungsperson."
