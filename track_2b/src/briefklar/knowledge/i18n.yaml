# Fixed client-facing strings in the 13 client languages (handout labels, section headings, progress steps).
# These are product strings, not model output.
#
# TODO(native-check): every language except de/fr/it/en was written by the build assistant and has NOT
# been reviewed by a native speaker. Tigrinya and Tamil in particular need review before any real use.
# Record reviewer and date in `reviewed` when done; tests/test_sources_required.py lists what is open.
