# Authority directory (spec section 9.4).
#
# SOURCE REQUIRED for every entry: phone, email, web and address must be copied from the authority's
# official website (or an official federal/cantonal publication), with `source_url` (the page it was
# copied from) and `retrieved` (date). Nothing here may be typed from memory. Until an entry is sourced:
#   - the app shows "official contact not yet sourced" instead of a contact,
#   - the CONTACT_MISMATCH red-flag check is skipped for it,
#   - tests/test_sources_required.py fails for it.
# Names are used for matching only; names[0] is the one shown to the counsellor.
#
# State on 2026-10-12: 17 entries are sourced (each value was read on the page in `source_url` that day).
# A human should look at them once before they are relied on. Three Vaud entries are still open because
# www.vd.ch could not be reached from the machine that did the sourcing.
# `email: null` on a sourced entry means the source page gives no e-mail address (contact form only).
authorities:
  - id: sem
    # Names as on the DE, FR and IT contact pages (the FR pages use both "Etat" and "État").
    names: ["Staatssekretariat für Migration", "Secrétariat d'Etat aux migrations", "Secrétariat d'État aux migrations",
            "Segreteria di Stato della migrazione", "SEM"]
    level: federal
    phone: "+41 58 465 11 11"   # "Loge", switchboard
    email: null                 # none on the page: contact forms per topic
    web: "https://www.sem.admin.ch"
    address: "Quellenweg 6, 3003 Bern"   # postal address on the same page: "CH-3003 Bern"
    source_url: https://www.sem.admin.ch/sem/de/home/sem/kontakt.html
    retrieved: 2026-10-12

  - id: serafe
    # The site uses "SERAFE AG" in German, French and Italian.
    names: ["Serafe AG", "SERAFE"]
    level: federal_mandate
    phone: "058 201 31 67"
    email: null                 # none on the page: contact form
    web: "https://www.serafe.ch"
    address: "Postfach, 8010 Zürich"
    source_url: https://www.serafe.ch/de/kontakt/
    retrieved: 2026-10-12

