# Authority directory (spec section 9.4).
#
# SOURCE REQUIRED for every entry: phone, email, web and address must be copied by a human from the
# authority's official website, with `source_url` (the page it was copied from) and `retrieved` (date).
# Nothing here may be typed from memory. Until an entry is sourced:
#   - the app shows "official contact not yet sourced" instead of a contact,
#   - the CONTACT_MISMATCH red-flag check is skipped for it,
#   - tests/test_sources_required.py fails for it.
